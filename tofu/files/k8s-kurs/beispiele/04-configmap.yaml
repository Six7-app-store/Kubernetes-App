apiVersion: v1
kind: ConfigMap
metadata:
  name: begruessung
data:
  index.html: |
    <h1>Hallo aus einer ConfigMap!</h1>
---
apiVersion: v1
kind: Pod
metadata:
  name: web-config
  labels:
    app: web-config
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
  volumes:
    - name: html
      configMap:
        name: begruessung
